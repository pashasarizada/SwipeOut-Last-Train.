name: swipeout_last_train
description: "SwipeOut: Last Train — offline, turn-based metro puzzle game."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.8.1

dependencies:
  animations: ^2.1.1
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/levels/
